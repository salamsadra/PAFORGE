[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-forge"
version = "0.10.0.dev5"
description = "PAForge: hybrid Python-MATLAB photoacoustic research and benchmark workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.9", "matplotlib>=3.7", "pydantic>=2.5", "typer>=0.12", "PyYAML>=6"]

[project.optional-dependencies]
ui = ["gradio>=5.0,<7"]
train = ["torch>=2.1"]
patato = ["patato>=0.6.1"]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[project.scripts]
paforge = "paforge.cli:app"

[tool.setuptools.packages.find]
include = ["paforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"paforge.hybrid" = ["matlab/*.m", "matlab/+pahybrid/*.m", "matlab/tests/*.m"]
